<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Smart Agriculture System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4ed;
      --panel: #ffffff;
      --ink: #1a2e1a;
      --muted: #5a6e5a;
      --line: #d4ddd0;
      --brand: #2d8c52;
      --brand-hover: #236d3f;
      --accent: #e8f5e9;
      --danger: #c0392b;
      --gold: #f39c12;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    main {
      width: min(1380px, calc(100% - 32px));
      margin: 28px auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
    }

    header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h2 .icon {
      font-size: 20px;
    }

    label {
      display: block;
      margin: 10px 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input,
    select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(45, 140, 82, 0.1);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 6px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--brand-hover);
    }

    .btn-secondary {
      background: #fff;
      color: var(--brand);
      border: 1.5px solid var(--brand);
    }

    .btn-secondary:hover {
      background: var(--accent);
    }

    .btn-gemini {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .btn-gemini:hover {
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--accent);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 15px;
    }

    .crop-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      padding: 0;
      list-style: none;
    }

    .crop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      transition: background 0.15s;
    }

    .crop-item:hover {
      background: var(--accent);
    }

    .crop-item small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .chart {
      width: 100%;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: none;
    }

    .gemini-box {
      margin-top: 14px;
      padding: 16px;
      background: linear-gradient(135deg, #f3e7ff 0%, #e8f0ff 100%);
      border-radius: 8px;
      border: 1px solid #d4c5f0;
      display: none;
      font-size: 14px;
      line-height: 1.7;
    }

    .gemini-box .best-crop {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 14px 0;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 300px 1fr;
      }

      .gemini-section {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 820px) {
      main {
        width: calc(100% - 24px);
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .gemini-section {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Smart Crop Recommendation System</h1>
      <p>Enter farm data to get crop predictions, live market prices, and AI-powered advice.</p>
    </header>

    <div class="layout">

      <!-- LEFT: Input Panel -->
      <section>
        <h2><span class="icon"></span> Farm Data</h2>

        <button class="btn-secondary" id="locationBtn" type="button">Get Location</button>

        <div class="row" style="margin-top: 6px;">
          <div>
            <label for="lat">Latitude</label>
            <input id="lat" type="number" step="any" placeholder="13.08">
          </div>
          <div>
            <label for="lon">Longitude</label>
            <input id="lon" type="number" step="any" placeholder="80.27">
          </div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <div>
            <label for="n">Nitrogen (N)</label>
            <input id="n" type="number" step="any" placeholder="90">
          </div>
          <div>
            <label for="p">Phosphorus (P)</label>
            <input id="p" type="number" step="any" placeholder="42">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="k">Potassium (K)</label>
            <input id="k" type="number" step="any" placeholder="43">
          </div>
          <div>
            <label for="ph">pH</label>
            <input id="ph" type="number" step="any" placeholder="6.5">
          </div>
        </div>

        <div class="divider"></div>

        <label for="farm_size">Farm Size (acres)</label>
        <input id="farm_size" type="number" step="any" placeholder="5">

        <label for="soil_type">Soil Type</label>
        <select id="soil_type">
          <option value="">-- Select --</option>
          <option value="Alluvial">Alluvial</option>
          <option value="Black (Regur)">Black (Regur)</option>
          <option value="Red">Red</option>
          <option value="Laterite">Laterite</option>
          <option value="Sandy">Sandy</option>
          <option value="Clay">Clay</option>
          <option value="Loamy">Loamy</option>
          <option value="Saline">Saline</option>
        </select>

        <label for="terrain">Terrain</label>
        <select id="terrain">
          <option value="">-- Select --</option>
          <option value="Plain">Plain / Flatland</option>
          <option value="Hilly">Hilly</option>
          <option value="Coastal">Coastal</option>
          <option value="Plateau">Plateau</option>
          <option value="River Delta">River Delta</option>
          <option value="Arid / Desert">Arid / Desert</option>
        </select>

        <button class="btn-primary" id="analyzeBtn" type="button">Analyze</button>
        <div class="status" id="status"></div>
      </section>

      <!-- CENTER: Results Panel -->
      <section>
        <h2><span class="icon"></span> Analysis Results</h2>
        <div class="grid">
          <div class="metric">
            <span>Weather</span>
            <strong id="weather">Waiting...</strong>
          </div>
          <div class="metric">
            <span>Location</span>
            <strong id="location">Waiting...</strong>
          </div>
        </div>
        <ul class="crop-list" id="crops"></ul>
        <img class="chart" id="chart" alt="Crop price chart">
      </section>

      <!-- RIGHT: Gemini Panel -->
      <section class="gemini-section">
        <h2><span class="icon"></span>AI Analysis</h2>
        <button class="btn-gemini" id="geminiBtn" type="button" disabled>Get AI Recommendation</button>
        <div class="gemini-box" id="geminiBox">
          <div class="best-crop" id="bestCrop"></div>
          <div id="summary"></div>
        </div>
      </section>

    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const locationBtn = $("locationBtn");
    const analyzeBtn = $("analyzeBtn");
    const geminiBtn = $("geminiBtn");
    const statusEl = $("status");
    const weatherEl = $("weather");
    const locationEl = $("location");
    const cropsEl = $("crops");
    const chartEl = $("chart");
    const geminiBox = $("geminiBox");
    const bestCropEl = $("bestCrop");
    const summaryEl = $("summary");

    let currentData = null;

    locationBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        setStatus("Geolocation not supported.", true);
        return;
      }
      setStatus("Getting location...");
      navigator.geolocation.getCurrentPosition(
        pos => {
          $("lat").value = pos.coords.latitude.toFixed(6);
          $("lon").value = pos.coords.longitude.toFixed(6);
          setStatus("Location captured.");
        },
        () => setStatus("Could not get location. Enter manually.", true),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    analyzeBtn.addEventListener("click", async () => {
      const payload = {
        lat: $("lat").value,
        lon: $("lon").value,
        N: $("n").value,
        P: $("p").value,
        K: $("k").value,
        ph: $("ph").value,
      };

      setLoading(true);
      setStatus("Analyzing data...");
      geminiBox.style.display = "none";

      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        currentData = data;
        renderResult(data);
        geminiBtn.disabled = false;
        setStatus("Analysis complete.");
      } catch (e) {
        weatherEl.textContent = "Failed";
        locationEl.textContent = "Failed";
        setStatus("Analysis failed. Check connection.", true);
      }

      setLoading(false);
    });

    geminiBtn.addEventListener("click", async () => {
      if (!currentData) return;
      geminiBtn.disabled = true;
      geminiBtn.textContent = " Analyzing...";

      try {
        const res = await fetch("/gemini_summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            weather: currentData.weather,
            location: currentData.location,
            crops: currentData.crops.map(c => c.crop),
            soil_npk: {
              N: $("n").value,
              P: $("p").value,
              K: $("k").value,
              ph: $("ph").value
            },
            farm_info: {
              farm_size: $("farm_size").value || "Not specified",
              soil_type: $("soil_type").value || "Not specified",
              terrain: $("terrain").value || "Not specified"
            }
          })
        });
        const result = await res.json();
        geminiBox.style.display = "block";
        bestCropEl.textContent = result.best_crop ? `Best: ${titleCase(result.best_crop)}` : "";
        bestCropEl.style.display = result.best_crop ? "inline-block" : "none";
        summaryEl.innerHTML = (result.summary || "No summary available.").replace(/\n/g, "<br>");
      } catch (e) {
        geminiBox.style.display = "block";
        bestCropEl.style.display = "none";
        summaryEl.textContent = "Failed to get AI summary.";
      }

      geminiBtn.disabled = false;
      geminiBtn.textContent = "Get AI Recommendation";
    });

    function renderResult(data) {
      const w = data.weather || {};
      const loc = data.location || {};
      weatherEl.textContent = `${ fmt(w.temperature) }°C, ${ fmt(w.humidity) }% hum, ${ fmt(w.rainfall || 0) }mm rain`;
      locationEl.textContent = [loc.district, loc.state].filter(Boolean).join(", ") || "Unknown";

      cropsEl.innerHTML = "";
      const crops = data.crops || [];
      if (!crops.length) {
        cropsEl.innerHTML = "<li class='crop-item'>No crops found.</li>";
      } else {
        for (const crop of crops) {
          const li = document.createElement("li");
          li.className = "crop-item";
          li.innerHTML = `
            <div>
              <strong>${titleCase(crop.crop)}</strong>
              <small>${crop.unit || "Rs/quintal"}</small>
            </div>
            <strong style="color: var(--brand);">₹${Number(crop.estimated_value || 0).toLocaleString()}</strong>
          `;
          cropsEl.appendChild(li);
        }
      }

      if (data.chart_url) {
        chartEl.src = data.chart_url;
        chartEl.style.display = "block";
      }
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "status error" : "status";
    }

    function setLoading(on) {
      analyzeBtn.disabled = on;
      analyzeBtn.textContent = on ? "Analyzing..." : "Analyze";
    }

    function fmt(v) {
      return v === null || v === undefined ? "N/A" : v;
    }

    function titleCase(s) {
      return String(s || "").replace(/\b\w/g, c => c.toUpperCase());
    }
  </script>
</body>

</html>
