<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Smart Agriculture System</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f2;
      --panel: #ffffff;
      --ink: #17231d;
      --muted: #607066;
      --line: #d9e1d7;
      --brand: #2f7d57;
      --brand-dark: #235d42;
      --warn: #8a5a00;
      --danger: #9b1c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 32px auto;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(20, 42, 27, 0.06);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
    }

    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 6px;
      margin-top: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #e7efe8;
      color: var(--brand-dark);
      border: 1px solid #bfd2c2;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.75;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 72px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 18px;
    }

    .crop-list {
      display: grid;
      gap: 10px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .crop-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .crop-item small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .summary {
      margin-top: 14px;
      padding: 14px;
      background: #eef5ef;
      border-radius: 8px;
      color: #233b2d;
    }

    .chart {
      width: 100%;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: none;
    }

    .message {
      margin-top: 14px;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
      font-weight: 700;
    }

    .warning {
      color: var(--warn);
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 24px, 720px);
        margin: 22px auto;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Smart Agriculture System</h1>
      <p>Analyze soil nutrients, weather, location, crop predictions, and advisory summary.</p>
    </header>

    <div class="layout">
      <section>
        <h2>Farm Inputs</h2>
        <button class="secondary" id="locationBtn" type="button">Get Location</button>

        <label for="lat">Latitude</label>
        <input id="lat" type="number" step="any" placeholder="Example: 13.0827">

        <label for="lon">Longitude</label>
        <input id="lon" type="number" step="any" placeholder="Example: 80.2707">

        <label for="n">Nitrogen (N)</label>
        <input id="n" type="number" step="any" placeholder="Example: 90">

        <label for="p">Phosphorus (P)</label>
        <input id="p" type="number" step="any" placeholder="Example: 42">

        <label for="k">Potassium (K)</label>
        <input id="k" type="number" step="any" placeholder="Example: 43">

        <button id="analyzeBtn" type="button">Analyze</button>
        <div class="message" id="status"></div>
      </section>

      <section>
        <h2>Analysis Result</h2>
        <div class="grid">
          <div class="metric">
            <span>Weather</span>
            <strong id="weather">Waiting</strong>
          </div>
          <div class="metric">
            <span>Location</span>
            <strong id="location">Waiting</strong>
          </div>
        </div>

        <ul class="crop-list" id="crops"></ul>
        <img class="chart" id="chart" alt="Crop predicted value bar chart">
        <div class="summary" id="summary">Run analysis to view the advisory summary.</div>
      </section>
    </div>
  </main>

  <script>
    const locationBtn = document.getElementById("locationBtn");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const statusEl = document.getElementById("status");
    const weatherEl = document.getElementById("weather");
    const locationEl = document.getElementById("location");
    const cropsEl = document.getElementById("crops");
    const summaryEl = document.getElementById("summary");
    const chartEl = document.getElementById("chart");

    locationBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        setStatus("Geolocation is not supported in this browser.", true);
        return;
      }

      setStatus("Getting location...");
      navigator.geolocation.getCurrentPosition(
        (position) => {
          document.getElementById("lat").value = position.coords.latitude.toFixed(6);
          document.getElementById("lon").value = position.coords.longitude.toFixed(6);
          setStatus("Location captured.");
        },
        () => setStatus("Unable to get location. Enter latitude and longitude manually.", true),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    analyzeBtn.addEventListener("click", async () => {
      const payload = {
        lat: document.getElementById("lat").value,
        lon: document.getElementById("lon").value,
        N: document.getElementById("n").value,
        P: document.getElementById("p").value,
        K: document.getElementById("k").value
      };

      setLoading(true);
      setStatus("Analyzing farm data...");

      try {
        const response = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        renderResult(data);
        setStatus("Analysis complete.");
      } catch (error) {
        weatherEl.textContent = "Failed";
        locationEl.textContent = "Failed";
        setStatus("Analyze failed. Check the Flask terminal.", true);
      }

      setLoading(false);
    });

    function renderResult(data) {
      const weather = data.weather || {};
      const location = data.location || {};
      weatherEl.textContent = `${formatValue(weather.temperature)} C, ${formatValue(weather.humidity)}% humidity, ${formatValue(weather.rainfall || 0)} mm rain`;
      locationEl.textContent = [location.district, location.state].filter(Boolean).join(", ") || "Unknown";

      cropsEl.innerHTML = "";
      const crops = data.crops || [];
      if (!crops.length) {
        cropsEl.innerHTML = "<li class='crop-item'>No crop estimate found.</li>";
      } else {
        for (const crop of crops) {
          const item = document.createElement("li");
          item.className = "crop-item";
          item.innerHTML = `
            <div>
              <strong>${titleCase(crop.crop)}</strong>
              <small>predicted value · ${crop.unit || "Rs/quantity"}</small>
            </div>
            <strong>Rs. ${Number(crop.estimated_value || 0).toFixed(0)}</strong>
          `;
          cropsEl.appendChild(item);
        }
      }

      summaryEl.textContent = data.summary || "No summary available.";
      if (data.chart_url) {
        chartEl.src = data.chart_url;
        chartEl.style.display = "block";
      }
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "message error" : "message";
    }

    function setLoading(isLoading) {
      analyzeBtn.disabled = isLoading;
      analyzeBtn.textContent = isLoading ? "Analyzing..." : "Analyze";
    }

    function formatValue(value) {
      return value === null || value === undefined ? "N/A" : value;
    }

    function titleCase(value) {
      return String(value || "").replace(/\b\w/g, (char) => char.toUpperCase());
    }
  </script>
</body>
</html>
